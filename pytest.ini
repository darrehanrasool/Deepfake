[pytest]
testpaths = tests
pythonpath = src .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: marks unit tests
    integration: marks integration tests
    slow: marks slow tests (e.g. model training epochs)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

